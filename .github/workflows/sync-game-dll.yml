name: Sync game assembly

# Кладёт RoR2.dll (и BepInEx core) в кэш GitHub Actions, чтобы job 'build'
# в build.yml компилировал плагин против настоящей игровой сборки: сборка
# здесь работает как API-чек против обновлений игры.
#
# Файлы игры НЕ попадают ни в репозиторий, ни в артефакты, ни в релизы:
# они остаются только внутри кэша конкретного репозитория.
#
# Три способа наполнить кэш (Actions -> Sync game assembly -> Run workflow):
#
#   source = runner   self-hosted раннер на машине с игрой (Windows):
#                     скрипт сам заберёт RoR2.dll и BepInEx\core из папки игры;
#   source = draft    refs.zip приложен к черновому релизу этого репозитория
#                     (Releases -> Draft a new release, tag game-refs, НЕ
#                     публиковать): черновик не виден публике, игровая сборка
#                     не публикуется, скачивается токеном самого workflow;
#   source = url      без раннера: workflow скачает архив с игрой-сборкой по
#                     ссылке из секрета ROR2_REFS_URL (Settings -> Secrets and
#                     variables -> Actions). Архив (zip): в корне RoR2.dll,
#                     в папке bepinex/ - BepInEx.dll и 0Harmony.dll из
#                     BepInEx\core. Ссылку можно держать в приватном релизе
#                     или любом закрытом хранилище.
#
# После обновления игры: запустить ещё раз - ключ кэша включает sha256 сборки.
#
# actions/cache здесь v6 (рантайм Node.js 24, node20 деприкейтнут): self-hosted
# раннер job'а sync должен быть не старше Actions Runner 2.327.1. ubuntu-раннер
# закреплён на ubuntu-24.04, как и в build.yml, чтобы окружение не менялось
# под ногой из-за миграции метки ubuntu-latest.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'How to obtain the game assembly'
        type: choice
        default: runner
        options:
          - runner
          - url
          - draft
      game_dir:
        description: 'Path to the game folder on the runner (source=runner)'
        required: false
        default: 'D:\SteamLibrary\steamapps\common\Risk of Rain 2'

jobs:
  sync:
    name: Copy game assembly from the game folder (self-hosted)
    if: github.event.inputs.source == 'runner'
    runs-on: [ self-hosted, windows ]
    steps:
      - name: Locate and copy
        shell: pwsh
        run: |
          $game = "${{ github.event.inputs.game_dir }}"
          $managed = Get-ChildItem -Path $game -Directory -Filter "*_Data" |
                     ForEach-Object { Join-Path $_.FullName "Managed" } |
                     Where-Object { Test-Path (Join-Path $_ "RoR2.dll") } |
                     Select-Object -First 1
          if (-not $managed) { throw "RoR2.dll not found under $game" }

          New-Item -ItemType Directory -Force -Path game-managed/bepinex | Out-Null
          Copy-Item (Join-Path $managed "RoR2.dll") game-managed/
          Copy-Item (Join-Path $managed "com.unity.multiplayer-hlapi.Runtime.dll") game-managed/ -ErrorAction SilentlyContinue
          # полёт (FlyController) компилируется против KinematicCharacterMotor
          Copy-Item (Join-Path $managed "KinematicCharacterController.dll") game-managed/ -ErrorAction SilentlyContinue

          $bex = Join-Path (Split-Path (Split-Path $managed)) "BepInEx\core"
          if (Test-Path $bex) { Copy-Item "$bex\*.dll" game-managed/bepinex/ }
          if (-not (Test-Path (Join-Path "game-managed/bepinex" "BepInEx.dll"))) {
            throw "BepInEx\core not found under the game folder - install BepInEx 5 x64 first"
          }

          Get-ChildItem -Recurse game-managed | Select-Object FullName, Length

      - name: Record the build identity
        shell: pwsh
        run: |
          $sha = (Get-FileHash game-managed/RoR2.dll -Algorithm SHA256).Hash.ToLower()
          $sha | Out-File -Encoding ascii game-managed/SHA256.txt
          "sha256=$sha" | Out-File -Encoding ascii -Append $env:GITHUB_ENV
          Write-Host "RoR2.dll sha256 = $sha"

      - name: Save to cache
        uses: actions/cache/save@v6
        with:
          path: game-managed
          key: ror2-managed-v1-${{ env.sha256 }}

  sync-url:
    name: Download the game assembly from ROR2_REFS_URL
    # Контекст secrets недоступен в if-условиях jobs/steps (ошибка
    # «Unrecognized named-value: 'secrets'»), поэтому наличие секрета
    # проверяется внутри первого шага.
    if: github.event.inputs.source == 'url'
    runs-on: ubuntu-24.04
    steps:
      - name: Download and unpack
        env:
          REFS_URL: ${{ secrets.ROR2_REFS_URL }}
        run: |
          set -e
          if [ -z "$REFS_URL" ]; then
            echo "::error::Секрет ROR2_REFS_URL не задан: Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          mkdir -p game-managed
          curl -sSL -o refs.zip "$REFS_URL"
          python3 - <<'PY'
          import zipfile, os, shutil
          with zipfile.ZipFile("refs.zip") as z:
              names = z.namelist()
              def find(fn):
                  return next((n for n in names if os.path.basename(n) == fn), None)
              ror2 = find("RoR2.dll")
              if not ror2:
                  raise SystemExit("RoR2.dll not found inside the archive")
              with z.open(ror2) as src, open("game-managed/RoR2.dll", "wb") as dst:
                  shutil.copyfileobj(src, dst)
              for fn in ("BepInEx.dll", "0Harmony.dll"):
                  n = find(fn)
                  if n:
                      os.makedirs("game-managed/bepinex", exist_ok=True)
                      with z.open(n) as src, open(f"game-managed/bepinex/{fn}", "wb") as dst:
                          shutil.copyfileobj(src, dst)
              for extra in ("com.unity.multiplayer-hlapi.Runtime.dll",
                            "KinematicCharacterController.dll"):
                  n = find(extra)
                  if n:
                      with z.open(n) as src, open("game-managed/" + os.path.basename(n), "wb") as dst:
                          shutil.copyfileobj(src, dst)
          if not os.path.exists("game-managed/bepinex/BepInEx.dll"):
              raise SystemExit("bepinex/BepInEx.dll not found inside the archive")
          print("unpacked:", sorted(os.listdir("game-managed")))
          PY

      - name: Record the build identity
        run: |
          sha=$(sha256sum game-managed/RoR2.dll | cut -d' ' -f1)
          echo "$sha" > game-managed/SHA256.txt
          echo "sha256=$sha" >> "$GITHUB_ENV"
          echo "RoR2.dll sha256 = $sha"

      - name: Save to cache
        uses: actions/cache/save@v6
        with:
          path: game-managed
          key: ror2-managed-v1-${{ env.sha256 }}

  sync-draft:
    name: Download refs.zip from the draft release game-refs
    # Черновой релиз не виден публике, поэтому игровая сборка не публикуется.
    # ВАЖНО: contents: write, а не read. GitHub отдаёт черновики релизов только
    # identities с push-доступом («Only users with push access will receive
    # listings for draft releases» - docs.github.com/rest/releases/releases),
    # а GITHUB_TOKEN с contents: read push-доступа не имеет: список релизов
    # приходит без черновиков, шаг падает с «черновой релиз не найден», даже
    # если он создан правильно. Скачивание asset'а черновика требует того же.
    if: github.event.inputs.source == 'draft'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download and unpack
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -eo pipefail
          mkdir -p game-managed

          # один запрос, дальше работаем с локальной копией ответа
          gh api --paginate "repos/${{ github.repository }}/releases" > releases.json

          # диагностика: что вообще видно токену (черновик должен быть в списке)
          jq -r '.[] | "release: tag=\(.tag_name) draft=\(.draft) assets=[\(.assets | map(.name) | join(" "))]"' releases.json
          echo "drafts seen: $(jq '[.[] | select(.draft == true)] | length' releases.json)"

          ASSET_URL=$(jq -r '[.[] | select(.draft == true) | .assets[]
                              | select(.name == "refs.zip") | select(.state == "uploaded")
                              | .url][0] // empty' releases.json)
          if [ -z "$ASSET_URL" ]; then
            echo "::error::Черновой релиз с asset refs.zip не найден."
            echo "Чек-лист:"
            echo "  1) релиз сохранён как DRAFT (кнопка «Save draft», НЕ «Publish release»);"
            echo "  2) файл приложен к этому черновику и называется ровно refs.zip (state=uploaded);"
            echo "  3) черновик создан в ${{ github.repository }}, а не в форке;"
            echo "  4) у job'а sync-draft стоит permissions: contents: write - с contents: read"
            echo "     GitHub не показывает workflow-токену черновые релизы (см. комментарий выше)."
            if [ "$(jq '[.[] | select(.draft == true) | .assets[]
                        | select(.name == "refs.zip" and .state != "uploaded")] | length' releases.json)" != "0" ]; then
              echo "::warning::refs.zip в черновике есть, но ещё не дозагружен (state != uploaded) - дождитесь окончания загрузки."
            fi
            exit 1
          fi
          echo "asset url: $ASSET_URL"

          curl -fsSL -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/octet-stream" -o refs.zip "$ASSET_URL"
          rm -f releases.json
          python3 - <<'PY'
          import zipfile, os, shutil
          with zipfile.ZipFile("refs.zip") as z:
              names = z.namelist()
              def find(fn):
                  return next((n for n in names if os.path.basename(n) == fn), None)
              ror2 = find("RoR2.dll")
              if not ror2:
                  raise SystemExit("RoR2.dll not found inside the archive")
              with z.open(ror2) as src, open("game-managed/RoR2.dll", "wb") as dst:
                  shutil.copyfileobj(src, dst)
              for fn in ("BepInEx.dll", "0Harmony.dll"):
                  n = find(fn)
                  if n:
                      os.makedirs("game-managed/bepinex", exist_ok=True)
                      with z.open(n) as src, open(f"game-managed/bepinex/{fn}", "wb") as dst:
                          shutil.copyfileobj(src, dst)
              for extra in ("com.unity.multiplayer-hlapi.Runtime.dll",
                            "KinematicCharacterController.dll"):
                  n = find(extra)
                  if n:
                      with z.open(n) as src, open("game-managed/" + os.path.basename(n), "wb") as dst:
                          shutil.copyfileobj(src, dst)
          if not os.path.exists("game-managed/bepinex/BepInEx.dll"):
              raise SystemExit("bepinex/BepInEx.dll not found inside the archive")
          print("unpacked:", sorted(os.listdir("game-managed")))
          PY

      - name: Record the build identity
        run: |
          sha=$(sha256sum game-managed/RoR2.dll | cut -d' ' -f1)
          echo "$sha" > game-managed/SHA256.txt
          echo "sha256=$sha" >> "$GITHUB_ENV"
          echo "RoR2.dll sha256 = $sha"

      - name: Save to cache
        uses: actions/cache/save@v6
        with:
          path: game-managed
          key: ror2-managed-v1-${{ env.sha256 }}
