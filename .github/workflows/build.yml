name: Build menu dll

# Сборка RoR2SandboxMenu.dll в GitHub Actions.
#
# Плагин компилируется против настоящей игровой сборки RoR2.dll: это одновременно
# сборка и API-чек (если игру обновили и метод переименован, CI упадёт здесь, а не
# молча в игре). Файлы игры НЕ лежат в репозитории: их кладёт в кэш Actions
# воркфлоу sync-game-dll.yml, запущенный вручную на self-hosted раннере с игрой.
#
# Поэтому:
#   кэш есть   -> job build собирает dll и выкладывает артефакт;
#                 job publish-latest на каждом пуше в main обновляет постоянный
#                 релиз «latest» с актуальной dll; по тегу v* job release
#                 публикует отдельный номерной релиз;
#   кэша нет   -> job no-refs печатает понятную инструкцию и завершается успешно,
#                 чтобы первый push не выглядел сломанным.
#
# Раннеры ubuntu закреплены на 24.04: метка ubuntu-latest мигрирует на новые
# образы по расписанию GitHub (actions/runner-images#14748), а сборка не должна
# зависеть от внезапной смены окружения. Версии actions - мажоры на рантайме
# Node.js 24 (node20 деприкейтнут, changelog 2025-09-19); self-hosted раннер
# для sync-game-dll.yml должен быть не старше Actions Runner 2.327.1.

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-refs:
    name: Look for the cached game assembly
    runs-on: ubuntu-24.04
    outputs:
      # cache-matched-key, а не cache-hit: кэш сохраняется с ключом
      # ror2-managed-v1-<sha256>, а восстанавливаемся по префиксу
      hit: ${{ steps.cache.outputs.cache-matched-key != '' }}
    steps:
      - name: Restore RoR2.dll + BepInEx core from the Actions cache
        id: cache
        uses: actions/cache/restore@v6
        with:
          path: game-managed
          key: ror2-managed-v1-restore-${{ github.run_id }}
          restore-keys: ror2-managed-v1-

  no-refs:
    name: No game assembly in cache (info)
    runs-on: ubuntu-24.04
    needs: game-refs
    if: needs.game-refs.outputs.hit != 'true'
    steps:
      - name: Explain how to enable builds
        run: |
          echo "::warning::В кэше Actions нет RoR2.dll - сборка пропущена."
          echo "Один раз запустите workflow 'Sync game assembly' (sync-game-dll.yml):"
          echo "  source=runner  self-hosted раннер с игрой: путь к папке игры;"
          echo "  source=draft   refs.zip приложен к черновому релизу (tag game-refs);"
          echo "  source=url     секрет ROR2_REFS_URL со ссылкой на архив."
          echo "После этого каждый push будет собирать RoR2SandboxMenu.dll автоматически."

  build:
    name: Build RoR2SandboxMenu.dll
    runs-on: ubuntu-24.04
    needs: game-refs
    if: needs.game-refs.outputs.hit == 'true'
    steps:
      - uses: actions/checkout@v7

      - name: Restore the game assembly cache
        uses: actions/cache/restore@v6
        with:
          path: game-managed
          key: ror2-managed-v1-restore-${{ github.run_id }}
          restore-keys: ror2-managed-v1-

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'

      - name: Build (compile-time API check against the game build)
        env:
          # В expression-языке GitHub Actions нет функции substring(), поэтому
          # берём имя тега целиком (github.ref_name = "v1.2.3" для refs/tags/v1.2.3),
          # а ведущую "v" снимаем уже в bash: ${PLUGIN_VERSION#v}.
          PLUGIN_VERSION: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          VER_ARG=""
          if [ -n "$PLUGIN_VERSION" ]; then VER_ARG="-p:PluginVersion=${PLUGIN_VERSION#v}"; fi
          dotnet build plugin/RoR2SandboxMenu.csproj -c Release -nologo $VER_ARG \
            -p:RoR2ManagedDir="$GITHUB_WORKSPACE/game-managed" \
            -p:BepInExDir="$GITHUB_WORKSPACE/game-managed/bepinex"

      - name: Unit tests + game refs integration checks
        env:
          GAME_REFS_DIR: ${{ github.workspace }}/game-managed
        run: |
          dotnet test tests/RoR2SandboxMenu.Tests.csproj -c Release -nologo \
            -p:RoR2ManagedDir="$GITHUB_WORKSPACE/game-managed" \
            -p:BepInExDir="$GITHUB_WORKSPACE/game-managed/bepinex"

      - name: Collect the dll
        run: |
          mkdir -p dist
          find plugin/bin -name 'RoR2SandboxMenu.dll' -path '*Release*' -print -quit \
            | xargs -I{} cp {} dist/RoR2SandboxMenu.dll
          ls -la dist
          sha256sum dist/RoR2SandboxMenu.dll

      - uses: actions/upload-artifact@v7
        with:
          name: RoR2SandboxMenu-dll
          path: dist/RoR2SandboxMenu.dll

  publish-latest:
    name: Update the continuous "latest" release
    runs-on: ubuntu-24.04
    needs: [ game-refs, build ]
    if: github.ref == 'refs/heads/main' && needs.game-refs.outputs.hit == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: RoR2SandboxMenu-dll
          path: dist

      - name: Republish the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          sha256sum RoR2SandboxMenu.dll > SHA256SUMS.txt
          gh release delete latest --yes --cleanup-tag --repo "${{ github.repository }}" || true
          gh release create latest             --target "$GITHUB_SHA"             --title "Latest menu build"             --notes "Актуальная сборка последнего коммита main. RoR2SandboxMenu.dll кладётся в BepInEx/plugins/. Коммит: $GITHUB_SHA"             --repo "${{ github.repository }}"             RoR2SandboxMenu.dll SHA256SUMS.txt

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-24.04
    needs: [ game-refs, build ]
    if: startsWith(github.ref, 'refs/tags/v') && needs.game-refs.outputs.hit == 'true'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: RoR2SandboxMenu-dll
          path: dist

      - name: Package and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist
          zip -r RoR2SandboxMenu-${GITHUB_REF_NAME}.zip RoR2SandboxMenu.dll
          sha256sum RoR2SandboxMenu.dll RoR2SandboxMenu-${GITHUB_REF_NAME}.zip > SHA256SUMS.txt
          gh release create "${GITHUB_REF_NAME}" \
            --title "RoR2 Sandbox Menu ${GITHUB_REF_NAME}" \
            --notes "Сборка против игровой сборки из кэша Actions. dll кладётся в BepInEx/plugins." \
            RoR2SandboxMenu-${GITHUB_REF_NAME}.zip SHA256SUMS.txt

